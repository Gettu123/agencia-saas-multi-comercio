<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login</title>
  <link rel="stylesheet" href="../css/agency-theme.css" />
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand-mark"><span class="logo-dot" id="logo">A</span><span data-brand></span></div>
      <div class="nav-actions"><div id="lang-mount"></div><a class="btn btn-ghost" href="../index.html" data-i18n="switch_tenant">Trocar</a></div>
    </header>
    <section class="hero" id="login-card">
      <p class="kicker" data-i18n="owner_login">Dono</p>
      <h1 data-i18n="login_title">Entrar</h1>
      <p class="muted" id="demo-hint"></p>
      <form id="login-form">
        <label data-i18n="email">E-mail</label><input id="email" type="email" required />
        <label data-i18n="password">Senha</label><input id="password" type="password" required />
        <p id="error" class="muted" style="color:var(--danger)"></p>
        <button class="btn btn-primary" type="submit" data-i18n="enter">Entrar</button>
      </form>
    </section>
    <section class="hero lock" id="block-card" hidden>
      <p class="kicker">USD</p>
      <h1 data-i18n="blocked_title">Licenca suspensa</h1>
      <p class="usd" id="fee">US$ 29</p>
      <p class="muted" id="trade-name"></p>
      <div class="pay-methods" id="usd-methods"></div>
      <form id="code-form" style="margin-top:18px;text-align:left">
        <label data-i18n="activation_code">Codigo de acesso</label>
        <input id="act-code" maxlength="12" autocomplete="off" />
        <p id="code-msg" class="muted"></p>
        <button class="btn btn-primary" type="submit" data-i18n="activate">Ativar</button>
      </form>
    </section>
  </main>
  <script src="../core/license-code.js"></script>
  <script src="../core/auth-engine.js"></script>
  <script src="../core/gateways/usd-license-gateway.js"></script>
  <script src="../core/gateways/payment-hub.js"></script>
  <script src="../js/i18n.js"></script>
  <script src="../js/tenant-loader.js"></script>
  <script>
    (async function () {
      const params = new URLSearchParams(location.search);
      const tenantId = params.get("tenant") || "tenant_001_br";
      const forceBlocked = params.get("blocked") === "1";
      const config = await TenantLoader.load(tenantId);
      I18N.mount("#lang-mount");
      if (!localStorage.getItem("agency.lang.v1")) I18N.setLang(config.language || "pt");
      document.querySelector("[data-brand]").textContent = config.brand.name;
      document.querySelector("#logo").textContent = config.brand.logo_text.slice(0, 1);
      document.querySelector("#email").value = config.demo_users[0].email;
      const validation = await AuthEngine.validateTenant(tenantId);
      const agency = (await AuthEngine.getLicenses()).agency;
      function paint() {
        I18N.apply();
        document.querySelector("#demo-hint").textContent = tenantId.indexOf("_ve") >= 0 ? I18N.t("demo_hint_ve") : I18N.t("demo_hint_br");
        if (!validation.active || forceBlocked) {
          document.querySelector("#login-card").hidden = true;
          document.querySelector("#block-card").hidden = false;
          document.querySelector("#fee").textContent = "US$ " + ((validation.license && validation.license.monthly_fee_usd) || agency.monthly_fee_usd);
          document.querySelector("#trade-name").textContent = (validation.license && validation.license.trade_name) || config.brand.name;
          PaymentHub.renderLicense(document.querySelector("#usd-methods"), agency, validation.license);
        }
      }
      paint();
      window.addEventListener("agency:lang", paint);
      document.querySelector("#code-form").addEventListener("submit", async function (ev) {
        ev.preventDefault();
        const result = await LicenseCode.redeem(tenantId, document.querySelector("#act-code").value);
        const msg = document.querySelector("#code-msg");
        if (!result.ok) { msg.style.color = "var(--danger)"; msg.textContent = I18N.t("bad_code"); return; }
        msg.style.color = "var(--ok)"; msg.textContent = I18N.t("code_ok");
        location.replace("./login.html?tenant=" + encodeURIComponent(tenantId));
      });
      document.querySelector("#login-form").addEventListener("submit", function (ev) {
        ev.preventDefault();
        const email = document.querySelector("#email").value.trim().toLowerCase();
        const password = document.querySelector("#password").value;
        const user = config.demo_users.find(function (u) { return u.email.toLowerCase() === email && u.password === password; });
        if (!user) { document.querySelector("#error").textContent = I18N.t("invalid_login"); return; }
        AuthEngine.setSession({ tenant_id: tenantId, email: user.email, name: user.name, role: user.role, logged_at: new Date().toISOString() });
        location.href = "./index.html?tenant=" + encodeURIComponent(tenantId);
      });
    })().catch(function (err) { document.body.innerHTML = "<main class='shell'><p>" + err.message + "</p></main>"; });
  </script>
</body>
</html>
